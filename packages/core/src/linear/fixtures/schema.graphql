# Subconjunto del esquema público de Linear (linear/linear, packages/sdk/src/schema.graphql, @linear/sdk 102.0.0):
# solo los tipos, campos y argumentos que usa el adapter, con los tipos exactos del esquema real.
# Si el adapter pide algo más, se agrega aquí copiándolo del esquema real.

schema {
  query: Query
  mutation: Mutation
}

scalar DateTime
scalar TimelessDate
scalar DateTimeOrDuration

enum PaginationOrderBy {
  createdAt
  updatedAt
}

type Query {
  issues(after: String, filter: IssueFilter, first: Int, orderBy: PaginationOrderBy): IssueConnection!
  issue(id: String!): Issue!
  projects(after: String, first: Int): ProjectConnection!
  viewer: User!
  workflowStates(after: String, filter: WorkflowStateFilter, first: Int): WorkflowStateConnection!
  organization: Organization!
}

type Mutation {
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload!
  commentCreate(input: CommentCreateInput!): CommentPayload!
}

type Organization {
  urlKey: String!
}

type User {
  id: ID!
  name: String!
}

type Team {
  id: ID!
  key: String!
}

type WorkflowState {
  id: ID!
  name: String!
  type: String!
  position: Float!
  team: Team!
}

type Project {
  id: ID!
  name: String!
}

type WorkflowStateConnection {
  nodes: [WorkflowState!]!
  pageInfo: PageInfo!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: PageInfo!
}

type ProjectMilestone {
  id: ID!
  name: String!
  targetDate: TimelessDate
}

type IssueLabel {
  id: ID!
  name: String!
}

type IssueLabelConnection {
  nodes: [IssueLabel!]!
  pageInfo: PageInfo!
}

type ActorBot {
  name: String
}

type Comment {
  id: ID!
  body: String!
  user: User
  botActor: ActorBot
  createdAt: DateTime!
}

type CommentConnection {
  nodes: [Comment!]!
  pageInfo: PageInfo!
}

type IssueRelation {
  id: ID!
  type: String!
  issue: Issue!
  relatedIssue: Issue!
}

type IssueRelationConnection {
  nodes: [IssueRelation!]!
  pageInfo: PageInfo!
}

type Issue {
  id: ID!
  identifier: String!
  url: String!
  title: String!
  description: String
  priority: Float!
  estimate: Float
  labels(first: Int, after: String): IssueLabelConnection!
  assignee: User
  state: WorkflowState!
  team: Team!
  project: Project
  projectMilestone: ProjectMilestone
  parent: Issue
  relations(first: Int, after: String): IssueRelationConnection!
  inverseRelations(first: Int, after: String): IssueRelationConnection!
  updatedAt: DateTime!
  archivedAt: DateTime
  comments(first: Int, after: String, orderBy: PaginationOrderBy): CommentConnection!
}

type IssueConnection {
  nodes: [Issue!]!
  pageInfo: PageInfo!
}

type IssuePayload {
  success: Boolean!
  issue: Issue
}

type CommentPayload {
  success: Boolean!
  comment: Comment!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

input IssueFilter {
  project: NullableProjectFilter
  updatedAt: DateComparator
}

input NullableProjectFilter {
  id: EntityIdentifierIDComparator
}

input EntityIdentifierIDComparator {
  eq: ID
}

input DateComparator {
  gt: DateTimeOrDuration
}

input WorkflowStateFilter {
  team: TeamFilter
}

input TeamFilter {
  id: IDComparator
}

input IDComparator {
  eq: ID
}

input IssueUpdateInput {
  assigneeId: String
  stateId: String
}

input CommentCreateInput {
  body: String
  issueId: String
}
