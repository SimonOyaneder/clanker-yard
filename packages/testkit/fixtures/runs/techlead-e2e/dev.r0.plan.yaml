# El dev planea sin dudas de la issue: plan-check se salta.
match: { mode: plan, round: "*" }
events:
  - { at: 0, text: "Leo la issue y busco un molde en el código vecino" }
  - { at: 5, usage: { model: sonnet, in: 900, out: 220, cacheWrite: 0, cacheRead: 0, costUsd: 0.031 } }
result:
  status: success
  structured:
    outcome: ok
    summary: "Plan listo"
    payload:
      approach: "Crear createTransfer con el monto redondeado y validado"
      files: [src/transfer.ts]
      tests: [src/transfer.test.ts]
      mold: src/index.ts
      assumptions: []
      issueDoubts: []
