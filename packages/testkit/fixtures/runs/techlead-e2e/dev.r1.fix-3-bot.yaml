# Los tres fix llegan con round 1 (cada edge cuenta aparte): sirven en el orden de su nombre, cada uno con su patch.
match: { mode: fix, round: 1 }
times: 1
events:
  - { at: 0, text: "Agrego el monto al mensaje del error" }
  - { at: 5, usage: { model: sonnet, in: 700, out: 180, cacheWrite: 0, cacheRead: 0, costUsd: 0.018 } }
effects:
  - apply: patches/fix-3-bot.patch
run:
  test:
    - { ok: true }
result:
  status: success
  structured:
    outcome: ok
    summary: "Agrego el monto al mensaje del error"
    payload:
      files: [src/transfer.ts]
      rejected: []
      deletedTests: []
      cuts: []
