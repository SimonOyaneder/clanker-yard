# El dev junta los dos lados del conflicto en src/transfer.ts: la validación del PR y el estado de la base.
# Los archivos en conflicto llevan marcas con el sha del commit, que un patch no puede citar: se escribe el archivo entero.
match: { mode: conflict, round: "*" }
events:
  - { at: 0, text: "Junto la validación del PR con el estado nuevo de la base" }
  - { at: 5, usage: { model: sonnet, in: 900, out: 220, cacheWrite: 0, cacheRead: 0, costUsd: 0.024 } }
effects:
  - write:
      path: src/transfer.ts
      content: |
        export function createTransfer(amount: number) {
          if (amount <= 0) throw new RangeError(`amount must be positive, got ${amount}`);
          return { amount: Math.round(amount), status: "pending" };
        }
run:
  test:
    - { ok: true }
result:
  status: success
  structured:
    outcome: resolved
    summary: "Conflicto resuelto juntando los dos lados"
    payload:
      files: [src/transfer.ts]
      rejected: []
      deletedTests: []
      cuts: []
